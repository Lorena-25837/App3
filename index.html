<!DOCTYPE html>
<html>
<head> 
    <title>Cold or Allergies?</title>  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
        body { margin: 0; }
        .page {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: -100vw;
            overflow-y: auto;
            background-color: white;
        }
        .page:target {
            left: 0;
        }
    </style>
    <script>
        var allergy_count = 0;
        var cold_count = 0;

        function allergyAdd() {
            allergy_count++;
        }

        function coldAdd() {
            cold_count++;
        }

        function showResults() {
            let total = allergy_count + cold_count;
            let allergyPercent = total > 0 ? (allergy_count / total * 100).toFixed(1) : 0;
            let coldPercent = total > 0 ? (cold_count / total * 100).toFixed(1) : 0;
            document.getElementById("results").innerHTML = 
                "Probability it is allergies: " + allergyPercent + "%<br>" +
                "Probability it is a cold: " + coldPercent + "%";
        }
    </script>
</head>
<body>
    <div id="header" class="w3-container w3-flat-carrot">
        <h1>Cold or Allergies?</h1>
    </div>
    <div id="content" class="w3-container">
        <p>Answer a few short questions to find out!</p>
        <a href="#one" class="w3-btn w3-grey w3-round">Get Started</a>
    </div>

    <div class="page" id="one">
        <div class="w3-container w3-flat-carrot"><h1>Question 1</h1></div>
        <div class="w3-container">
            <p>Are your eyes watery and/or itchy?</p>
            <a href="#two" onclick="allergyAdd();" class="w3-button w3-black">Yes</a>
            <a href="#two" onclick="coldAdd();" class="w3-button w3-black">No</a>
        </div>
    </div>

    <div class="page" id="two">
        <div class="w3-container w3-flat-carrot"><h1>Question 2</h1></div>
        <div class="w3-container">
            <p>Do you have a fever?</p>
            <a href="#three" onclick="coldAdd();" class="w3-button w3-black">Yes</a>
            <a href="#three" onclick="allergyAdd();" class="w3-button w3-black">No</a>
        </div>
    </div>

    <div class="page" id="three">
        <div class="w3-container w3-flat-carrot"><h1>Question 3</h1></div>
        <div class="w3-container">
            <p>Do you have a sore throat?</p>
            <a href="#four" onclick="coldAdd();" class="w3-button w3-black">Yes</a>
            <a href="#four" onclick="allergyAdd();" class="w3-button w3-black">No</a>
        </div>
    </div>

    <div class="page" id="four">
        <div class="w3-container w3-flat-carrot"><h1>Question 4</h1></div>
        <div class="w3-container">
            <p>Are your symptoms seasonal and/or chronic?</p>
            <a href="#results" onclick="allergyAdd(); showResults();" class="w3-button w3-black">Yes</a>
            <a href="#results" onclick="coldAdd(); showResults();" class="w3-button w3-black">No</a>
        </div>
    </div>

    <div class="page" id="results">
        <div class="w3-container w3-flat-carrot"><h1>Results</h1></div>
        <div class="w3-container">
            <p id="results"></p>
        </div>
    </div>
</body>
</html>
